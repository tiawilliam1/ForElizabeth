<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Greece Local Guide | Greece Local Guide</title>
    <link rel="canonical" href="https://greecelocalguide.com/fr-contact-greece-local-guide.html">
    <link rel="alternate" hreflang="en" href="https://greecelocalguide.com/contact-greece-local-guide.html">
    <link rel="alternate" hreflang="fr" href="https://greecelocalguide.com/fr-contact-greece-local-guide.html">
    <link rel="alternate" hreflang="x-default" href="https://greecelocalguide.com/contact-greece-local-guide.html">


<link rel="stylesheet" href="style.css"></head>
<body>
    <div id="site-header"></div>
    <script src="components.js"></script>
    <h1 class="page-keyword" style="position:absolute;left:-9999px;">Contact Greece Local Guide</h1>
    
    <main>
        <section class="contact-section">
            <div class="contact-content">
                <!-- Left: Text with Heading -->
                <div class="contact-text">
                    <h2>Ready to explore Greece?</h2>
                    <ul>
                        <li>Athens, Greece</li>
                        <li><a href="tel:+3069429190805">+30 694 2919085</a></li>
                        <li><a href="tel:+3069429190805">+33 67 8 41 82 79</a></li>
                        <li><a href="mailto:greecelocalguide@gmail.com">greecelocalguide@gmail.com</a></li>
                       
                    </ul>
                </div>
        
                <!-- Right: Larger Image -->
                <div class="contact-image">
                    <img src="https://res.cloudinary.com/de74f3wze/image/upload/v1767102230/contact1_f9tfku.jpg" alt="Contact Image">
                </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedLanguage = localStorage.getItem('selectedLanguage') || 'en';

            const elements = {
                pageTitle: document.querySelector('title'),
                contactHeading: document.querySelector('.contact-text h2'),
                contactLocation: document.querySelector('.contact-text ul li:nth-child(1)')
            };

            const translations = {
                en: {
                    pageTitle: 'Contact Greece Local Guide | Greece Local Guide',
                    contactHeading: 'Ready to explore Greece?',
                    contactLocation: 'Athens, Greece'
                },
                fr: {
                    pageTitle: 'Contact | Greece Local Guide',
                    contactHeading: 'Prêt à explorer la Grèce ?',
                    contactLocation: 'Athènes, Grèce'
                },
                el: {
                    pageTitle: 'Επικοινωνία | Greece Local Guide',
                    contactHeading: 'Έτοιμοι να εξερευνήσετε την Ελλάδα;',
                    contactLocation: 'Αθήνα, Ελλάδα'
                }
            };

            function applyPageLanguage(lang) {
                const safeLang = translations[lang] ? lang : 'en';
                const content = translations[safeLang];
                document.documentElement.lang = safeLang;
                if (elements.pageTitle) elements.pageTitle.textContent = content.pageTitle;
                if (elements.contactHeading) elements.contactHeading.textContent = content.contactHeading;
                if (elements.contactLocation) elements.contactLocation.textContent = content.contactLocation;
            }

            window.addEventListener('shared-language-change', (event) => {
                const lang = event.detail && event.detail.lang ? event.detail.lang : 'en';
                applyPageLanguage(lang);
            });

            applyPageLanguage(savedLanguage);

            // Burger menu toggle
            const burgerMenuBtn = document.querySelector('.burger-menu-btn');
            const burgerMenu = document.querySelector('.burger-menu');
            const burgerIcon = document.querySelector('.burger-icon');
            const closeIcon = document.querySelector('.close-icon');
            const header = document.querySelector('header');

            burgerMenuBtn.addEventListener('click', () => {
                const isMenuOpen = burgerMenu.classList.toggle('active');
                burgerIcon.style.display = isMenuOpen ? 'none' : 'block';
                closeIcon.style.display = isMenuOpen ? 'block' : 'none';
                header.style.display = 'block';
            });

            closeIcon.addEventListener('click', () => {
                burgerMenu.classList.remove('hidden');
                burgerIcon.style.display = 'block';
                closeIcon.style.display = 'none';
                header.style.display = 'block';
            });
        });
    </script>
</body>
</html>
