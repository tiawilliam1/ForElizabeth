<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Greece Tours | Greece Local Guide</title>
    <link rel="canonical" href="https://greecelocalguide.com/central-greece-tours">
    <link rel="stylesheet" href="style.css"></head>
<body>
    <div id="site-header"></div>
    <script src="components.js"></script>
    <h1 class="page-keyword" style="position:absolute;left:-9999px;">Central Greece Tours</h1>

    <section class="back-button-container">
        <img src="images/backbutton3.png" alt="Back to Tours" class="back-button" onclick="goBack()">
    </section>

    <section class="athens-tours">
        
        <a href="hosios-loukas-monastery-tour.html" class="tour-card">
            <img src="https://res.cloudinary.com/de74f3wze/image/upload/v1769426112/12loukas_igns46.jpg" alt="Walking Tour of Athens">
            <h2>Holy Monastery of Hosios Loukas</h2>
            <p> Discover the UNESCO-listed Monastery of Hosios Loukas, a masterpiece of Byzantine art and architecture.</p>
        </a>
        
        <a href="delphi-day-trip-from-athens.html" class="tour-card">
            <img src="https://res.cloudinary.com/de74f3wze/image/upload/v1769426122/delphi123_fgjyqf.jpg" alt="Philosophical Tour">
            <h2>Delphi</h2>
            <p>Journey to the navel of the ancient world, where the Oracle once spoke and the ruins still echo with myth and prophecy.</p>
        </a>
    </section>

   
    
    <div id="site-footer"></div>
    <script>
        function goBack() {
            window.location.href = "greece-private-tours.html"; // Navigate back to greece-private-tours.html
        }

                // Select the burger menu button, navigation menu, icons, and header
const burgerMenuBtn = document.querySelector('.burger-menu-btn'); // The container for the icons
const burgerMenu = document.querySelector('.burger-menu'); // The navigation menu
const burgerIcon = document.querySelector('.burger-icon'); // The menu.png icon
const closeIcon = document.querySelector('.close-icon'); // The x.png icon
const header = document.querySelector('header'); // The header element

    burgerMenuBtn.addEventListener('click', () => {
    const isMenuOpen = burgerMenu.classList.toggle('active'); // Toggle the menu visibility

    // Toggle between the burger icon and the close icon
    if (isMenuOpen) {
        burgerIcon.style.display = 'none'; // Hide the burger icon (images/menu.png)
        closeIcon.style.display = 'block'; // Show the "X" icon (images/x.png)
        header.style.display = 'block'; // Ensure the header is visible
        console.log('Menu opened'); // Debugging log
    } else {
        burgerIcon.style.display = 'block'; // Show the burger icon (images/menu.png)
        closeIcon.style.display = 'none'; // Hide the "X" icon (images/x.png)
        header.style.display = 'block'; // Ensure the header remains visible
        console.log('Menu closed'); // Debugging log
    }
});

// Add a click event listener to the "X" button (close icon)
closeIcon.addEventListener('click', () => {
    console.log('Close button clicked'); // Debugging log

    // Close the menu by removing the 'active' class
    burgerMenu.classList.remove('hidden');

    // Show the burger icon (images/menu.png)
    burgerIcon.style.display = 'block';

    // Hide the "X" icon (images/x.png)
    closeIcon.style.display = 'none';

    // Ensure the header is visible
    header.style.display = 'block';
});
    </script>
</body>
</html>
