<body>
    <div id="site-header"></div>

            <img src="https://res.cloudinary.com/de74f3wze/image/upload/v1769426122/delphi123_fgjyqf.jpg" alt="Sanctuaire antique de Delphes" loading="lazy" decoding="async" width="1200" height="800">

            <p>Voyagez jusqu'au centre du monde antique, où parlait autrefois l'oracle de Delphes.</p>
        </a>
    </section>

   
    
    <div id="site-footer"></div>
    <script>
        function goBack() {
            window.location.href = "greece-private-tours.html"; // Navigate back to greece-private-tours.html
        }
        document.addEventListener('DOMContentLoaded', () => {
            const savedLanguage = localStorage.getItem('selectedLanguage') || 'fr';
            const cards = Array.from(document.querySelectorAll('.athens-tours .tour-card'));
            const pageTitle = document.querySelector('title');
            const pageKeyword = document.querySelector('.page-keyword');
            const backButton = document.querySelector('.back-button');

            const translations = {
                en: {
                    pageTitle: 'Central Greece Tours from Athens | Delphi & Hosios Loukas',
                    pageKeyword: 'Central Greece Tours',
                    backAlt: 'Back to Tours',
                    cards: [
                        {
                            title: 'Holy Monastery of Hosios Loukas',
                            desc: 'Discover the UNESCO-listed Monastery of Hosios Loukas, a masterpiece of Byzantine art and architecture.'
                        },
                        {
                            title: 'Delphi',
                            desc: 'Journey to the navel of the ancient world, where the Oracle once spoke and the ruins still echo with myth and prophecy.'
                        }
                    ]
                },
                fr: {
                    pageTitle: 'Visites privées en Grèce centrale depuis Athènes | Delphes & Hosios Loukas',
                    pageKeyword: 'Visites privées en Grèce centrale depuis Athènes',
                    backAlt: 'Retour aux visites',
                    cards: [
                        {
                            title: 'Saint Monastère d’Hosios Loukas',
                            desc: 'Découvrez le monastère d’Hosios Loukas, classé à l’UNESCO, chef-d’œuvre de l’art et de l’architecture byzantins.'
                        },
                        {
                            title: 'Delphes',
                            desc: 'Voyagez jusqu’au nombril du monde antique, où parlait l’Oracle et où les ruines résonnent encore de mythes et de prophéties.'
                        }
                    ]
                },
                el: {
                    pageTitle: 'Ξεναγήσεις στην Κεντρική Ελλάδα | Greece Local Guide',
                    pageKeyword: 'Ξεναγήσεις στην Κεντρική Ελλάδα',
                    backAlt: 'Επιστροφή στις ξεναγήσεις',
                    cards: [
                        {
                            title: 'Ιερά Μονή Οσίου Λουκά',
                            desc: 'Ανακαλύψτε τη Μονή Οσίου Λουκά, μνημείο UNESCO και αριστούργημα βυζαντινής τέχνης και αρχιτεκτονικής.'
                        },
                        {
                            title: 'Δελφοί',
                            desc: 'Ταξιδέψτε στον ομφαλό του αρχαίου κόσμου, όπου μιλούσε το Μαντείο και τα ερείπια αντηχούν ακόμη από μύθους και προφητείες.'
                        }
                    ]
                }
            };

            function applyPageLanguage(lang) {
                const safeLang = translations[lang] ? lang : 'en';
                const content = translations[safeLang];
                document.documentElement.lang = safeLang;

                if (pageTitle) pageTitle.textContent = content.pageTitle;
                if (pageKeyword) pageKeyword.textContent = content.pageKeyword;
                if (backButton) backButton.alt = content.backAlt;

                cards.forEach((card, index) => {
                    const cardContent = content.cards[index];
                    if (!cardContent) return;
                    const cardTitle = card.querySelector('h2');
                    const cardDesc = card.querySelector('p');
                    if (cardTitle) cardTitle.textContent = cardContent.title;
                    if (cardDesc) cardDesc.textContent = cardContent.desc;
                });
            }

            window.addEventListener('shared-language-change', (event) => {
                const lang = event.detail && event.detail.lang ? event.detail.lang : 'en';
                applyPageLanguage(lang);
            });

            applyPageLanguage(savedLanguage);
        });
    </script>
